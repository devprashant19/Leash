name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.6.0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: |
          fe fmt --check ingots
          fe fmt --check test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe check
      - name: Compile fail tests
        run: bash scripts/compile-fail.sh

  test-evm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe test
      - name: Test count parity check
        run: bash scripts/count-tests.sh

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe test --backend native

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe build
      - run: fe build --backend native
      - name: Verify module size under 24,576 bytes
        run: |
          fe build --emit sizes
          size=$(awk '/runtime:/ {print $2}' out/LeashModule.sizes.txt)
          echo "LeashModule runtime size: $size bytes"
          if [ "$size" -ge 24576 ]; then
            echo "Error: LeashModule size $size exceeds 24,576 bytes!"
            exit 1
          fi
      - name: Run golden CLI tests
        run: bash scripts/golden.sh
      - name: Run fixture parity tests
        run: bash scripts/fixtures-to-golden.sh

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check decide has no uses clause
        run: |
          if grep -nE 'fn decide[^{]*uses' ingots/policy/src/*.fe 2>/dev/null; then
            echo "Violation: policy::decide must have no uses clause!"
            exit 1
          fi
          echo "Rule check passed: decide is pure."
      - name: Check no rule logic outside policy
        run: |
          if grep -nE 'policy::rules|policy::ledger' ingots/cli/src/*.fe ingots/module/src/*.fe 2>/dev/null; then
            echo "Violation: CLI and Module must only access policy public API!"
            exit 1
          fi
          echo "Component isolation check passed."

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build contracts and the native leash CLI
        run: |
          fe build ingots/module
          fe build ingots/testkit
          fe build --backend native
          test -x out/cli
      - name: Run Demo End-to-End (predictions from the real Fe CLI)
        env:
          # Fail instead of falling back to the TypeScript mirror of the rules.
          LEASH_REQUIRE_NATIVE: "1"
        run: |
          cd demo
          npm ci
          npm run demo
          grep -q '"predictionSource": "fe-native"' run.local.json
      - name: Upload the demo run (fe-native predictions vs on-chain results)
        uses: actions/upload-artifact@v4
        with:
          name: demo-run-fe-native
          path: demo/run.local.json


  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fresh Fe build
        run: |
          fe build ingots/module
          fe build ingots/testkit
          fe build --backend native
      - name: Web artifacts match the fresh Fe build
        run: node scripts/sync-web-assets.mjs --check
      - name: Bundled leash binary matches the fresh build
        run: |
          chmod +x api/_assets/leash-linux-x86_64
          test "$(api/_assets/leash-linux-x86_64 fingerprint)" = "$(out/cli fingerprint)"
          test "$(api/_assets/leash-linux-x86_64 --version)" = "$(out/cli --version)"
      - name: Install, typecheck and build the Vercel site
        run: |
          npm ci
          npm run typecheck:web
          npm run build:web
      - name: Web functions test (predictions from the bundled Fe binary)
        env:
          LEASH_REQUIRE_NATIVE: "1"
        run: npm run test:web
