name: Release

on:
  workflow_dispatch:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

env:
  FE_VERSION: v26.6.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: leash-linux-x86_64
          - os: macos-14
            asset: leash-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - name: Build the native leash CLI
        run: |
          fe build --backend native
          cp out/cli "${{ matrix.asset }}"
      - name: Smoke test
        run: |
          ./${{ matrix.asset }} --version
          test "$(./${{ matrix.asset }} fingerprint)" = "0x3efcfc58aec5d1e7e81b5bded7820ed3ed8a0e654cf4aff3bfb793a7494ae6ee"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "leash $GITHUB_REF_NAME" --notes "Native leash CLI built with Fe 26.6.0." \
            || gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
